  <script type="module">
    import { PARK_VENUES, VENUE_BY_ID, FACILITY_TYPES, SERVICE_FACILITIES, SCHEDULE_PRESETS, OFFICIAL_NOTICES, PARK_GEO_ANCHOR, ROAD_NODES, geoToParkXZ, findNearestRoadNode, findWalkingRoute, getShowStatus, parseTimeToMinutes } from './park-data.js';
    import { createParkScene3D } from './scene-3d.js';

    const $ = (id) => document.getElementById(id);
    const icon = (name) => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
    const formatMinute = (m) => `${String(Math.floor(m / 60)).padStart(2,'0')}:${String(m % 60).padStart(2,'0')}`;
    function sanyaMinute() {
      const now = new Date();
      return (now.getUTCHours() * 60 + now.getUTCMinutes() + 480) % 1440;
    }
    const zones = { all: '全园', theaters: '核心剧院', streets: '主题街区', villages: '黎苗民俗', adventure: '奇幻游乐' };
    const landmarks = new Set(['entrance','goddess_portal','theater_1','theater_2','romance_plaza','love_plaza','xiulou_plaza']);
    const facilityTypes = new Map(FACILITY_TYPES.map((type) => [type.id, type]));
    const places = [...PARK_VENUES, ...SERVICE_FACILITIES];
    const placeById = new Map(places.map((place) => [place.id, place]));
    const restroomTypes = ['restroom', 'accessible_wc'];
    const state = {
      zone: 'all', preset: 'regular_two_shows', minute: sanyaMinute(), liveClock: true,
      origin: 'entrance', selected: null, route: null, tab: 'facilities',
      facilityTypes: new Set(), liveVenues: new Set(), night: false, mapMode: 'scene',
    };
    let park3D;
    let serviceOpener = $('serviceDock');
    let cardOpener = $('btnReset');
    let mapObstacles = [];
    let dirtyObstacles = true;
    const venuePins = [];
    const facilityPins = [];
    const scheduleRows = new Map();

    function makePin(place, isFacility) {
      const el = document.createElement('button');
      el.dataset.place = place.id;
      el.tabIndex = -1;
      el.inert = true;
      el.setAttribute('aria-label', place.name);
      el.title = place.name;
      let leader;
      if (isFacility) {
        el.className = 'facility-pin' + (restroomTypes.includes(place.type) ? ' restroom' : '');
        el.innerHTML = icon(place.type);
        $('leaderLines').insertAdjacentHTML('beforeend','<line visibility="hidden"/>');
        leader = $('leaderLines').lastElementChild;
      } else {
        const core = place.badgeType === 'red' || place.badgeType === 'gate';
        el.className = 'map-label' + (core ? ' core' : '');
        el.innerHTML = '<span class="live-dot" aria-hidden="true"></span>';
        el.append(document.createTextNode(place.name));
      }
      el.addEventListener('click', () => selectPlace(place, null, el));
      $('labelLayer').appendChild(el);
      return { el, place, leader, isFacility, width: 0, height: 0, shown: false };
    }
    for (const place of PARK_VENUES) venuePins.push(makePin(place, false));
    for (const place of SERVICE_FACILITIES) facilityPins.push(makePin(place, true));
    const pinSize = new ResizeObserver((entries) => {
      for (const entry of entries) {
        const pin = pinByElement.get(entry.target);
        pin.width = entry.target.offsetWidth;
        pin.height = entry.target.offsetHeight;
      }
    });
    const pinByElement = new Map([...venuePins,...facilityPins].map((pin) => [pin.el,pin]));
    for (const el of pinByElement.keys()) pinSize.observe(el);
    const chrome = [...document.querySelectorAll('[data-map-ui]')];
    const chromeSize = new ResizeObserver(() => { dirtyObstacles = true; });
    for (const el of chrome) chromeSize.observe(el);
    window.addEventListener('resize', () => { dirtyObstacles = true; });

    function pinPriority(pin) {
      if (pin.place.id === state.selected) return 4;
      if (state.liveVenues.has(pin.place.id)) return 3;
      if (landmarks.has(pin.place.id)) return 2;
      return pin.isFacility ? 1 : 0;
    }
    const pins = [...venuePins, ...facilityPins];
    function rankPins() { pins.sort((a,b) => pinPriority(b) - pinPriority(a)); }
    function setPinVisibility(pin, on) {
      if (on === pin.shown) return;
      pin.shown = on;
      pin.el.classList.toggle('on-map', on);
      pin.el.inert = !on;
      pin.el.tabIndex = on ? 0 : -1;
      if (!on && pin.leader) {
        pin.leader.setAttribute('visibility','hidden');
        pin.leaderKey = undefined;
      }
    }
    const facilityOffsets = [[0,0]];
    for (const radius of [28,54,80]) {
      for (let i = 0; i < 8; i++) {
        const angle = i * Math.PI / 4;
        facilityOffsets.push([Math.round(Math.sin(angle) * radius), Math.round(-Math.cos(angle) * radius)]);
      }
    }
    function projectLabels(project) {
      if (dirtyObstacles) {
        mapObstacles = chrome.filter((el) => !el.hidden).map((el) => el.getBoundingClientRect());
        dirtyObstacles = false;
      }
      const width = $('canvasWrap').clientWidth, height = $('canvasWrap').clientHeight;
      const accepted = [];
      for (const pin of pins) {
        const { place, el, isFacility } = pin;
        const allowed = isFacility ? state.facilityTypes.has(place.type) : state.zone === 'all' || place.zone === state.zone;
        if (!allowed || state.mapMode === 'compare') { setPinVisibility(pin,false); continue; }
        const anchor = project(place.pos.x, isFacility ? 4 : place.pinHeight, place.pos.z);
        const w = pin.width || el.offsetWidth, h = pin.height || el.offsetHeight;
        if (!anchor.visible || anchor.x < 0 || anchor.x > width || anchor.y < 0 || anchor.y > height) { setPinVisibility(pin,false); continue; }
        let box;
        for (const offset of isFacility ? facilityOffsets : [[0,0]]) {
          const x = anchor.x + offset[0], y = anchor.y + offset[1];
          const left = x-w/2, right = x+w/2, top = y-h/2, bottom = y+h/2+3;
          if (left < 2 || right > width-2 || top < 2 || bottom > height-2) continue;
          if (mapObstacles.some((r) => left < r.right+3 && right > r.left-3 && top < r.bottom+3 && bottom > r.top-3)) continue;
          if (accepted.some((other) => {
            const dx = Math.abs(x-other.x), dy = Math.abs(y-other.y);
            if (!isFacility && !other.isFacility && dx < 76 && dy < 26) return true;
            return dx < (w+other.w)/2+3 && dy < (h+other.h)/2+3;
          })) continue;
          box = { x, y, w, h, isFacility };
          break;
        }
        setPinVisibility(pin, !!box);
        if (!box) continue;
        pin.hitBox = box;
        accepted.push(box);
        const transform = `translate3d(${box.x.toFixed(1)}px,${box.y.toFixed(1)}px,0) translate(-50%,-50%)`;
        if (pin.transform !== transform) { el.style.transform = transform; pin.transform = transform; }
        if (pin.leader) {
          const offset = box.x !== anchor.x || box.y !== anchor.y;
          const key = offset ? [anchor.x,anchor.y,box.x,box.y].map((n) => n.toFixed(1)).join(' ') : '';
          if (key !== pin.leaderKey) {
            pin.leader.setAttribute('visibility', offset ? 'visible' : 'hidden');
            if (offset) ['x1','y1','x2','y2'].forEach((attr,i) => pin.leader.setAttribute(attr,key.split(' ')[i]));
            pin.leaderKey = key;
          }
        }
      }
    }

    function setZone(id) {
      state.zone = id;
      for (const btn of $('zoneBar').children) btn.setAttribute('aria-pressed', String(btn.dataset.zone === id));
    }
    for (const [id,name] of Object.entries(zones)) {
      const btn = document.createElement('button');
      btn.className = 'zone glass';
      btn.dataset.zone = id;
      btn.textContent = name;
      btn.addEventListener('click', () => {
        leaveOriginal();

    function onOrientation(event) {
      const screenAngle = window.screen.orientation?.angle ?? window.orientation ?? 0;
      let heading;
      if (Number.isFinite(event.webkitCompassHeading) && event.webkitCompassHeading >= 0) {
        heading = event.webkitCompassHeading + screenAngle;
      } else if ((event.absolute || event.type === 'deviceorientationabsolute') && Number.isFinite(event.alpha)) {
        // 将屏幕上边缘投影到水平面，横屏时也计入手机的前倾和侧倾。
        const rad = Math.PI / 180, screen = screenAngle * rad;
        const beta = (event.beta ?? 0) * rad, gamma = (event.gamma ?? 0) * rad;
        const east = Math.sin(screen) * Math.cos(gamma);
        const north = Math.cos(screen) * Math.cos(beta) + Math.sin(screen) * Math.sin(beta) * Math.sin(gamma);
        if (Math.hypot(east, north) < .001) return;
        heading = Math.atan2(east, north) / rad - event.alpha;

    function applyLocation(coords, requested = false) {

      const demo = !geo?.inPark, previous = locationFix;
      const { x, z } = demo ? gate : geo;
      const nodeId = demo ? VENUE_BY_ID.entrance.roadNode : findNearestRoadNode(x,z);
      const modeChanged = !previous || previous.demo !== demo;
      const heading = demo ? entranceHeading : (Number.isFinite(coords.heading) && coords.heading >= 0 ? coords.heading : null);
      locationFix = { x, z, nodeId, demo, heading };
      const previousOrigin = state.origin;

    function movedFromPin(event) { return Math.hypot(event.clientX - pinTap.x, event.clientY - pinTap.y) > 6; }
    mapSurface.addEventListener('pointermove', (event) => {
      if (pinTap?.id === event.pointerId && movedFromPin(event)) pinTap = null;
    });
    mapSurface.addEventListener('pointerup', (event) => {
      if (pinTap?.id === event.pointerId && !movedFromPin(event) && pinTap.pin.shown) pinTap.pin.el.click();
      pinTap = null;
    });
    mapSurface.addEventListener('pointercancel', () => { pinTap = null; });
    document.addEventListener('keydown', (event) => {
      if (event.key !== 'Escape' || $('schedSheet').open) return;
      if (!$('services').hidden) closeServices(true);
      else if (!$('venueCard').hidden) closeCard(true);
      else if (!$('locationToast').hidden) { hideLocationToast(); $('btnLocate').focus(); }
      else if (state.mapMode !== 'scene') { setMapMode('scene'); $('btnCompare').focus(); }
    });

    populateSchedule(); setClockRange(); updateSchedule(); syncRoute(); syncCompareOpacity();
    try {
      park3D = createParkScene3D($('canvasWrap'),projectLabels,updateCompass);
    } catch (error) {
      $('modelLoader').textContent = '3D 地图未能启动，请检查浏览器的图形加速后刷新';
      throw error;
    }
  </script>
</body>
</html>
